<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PharmAssist - Contraindications</title>
<link rel="stylesheet" href="/drug-info.css">
</head>
<body>

<div class="container">

    <h1>PharmAssist</h1>
    <h2>Contraindication Checker</h2>

    <!-- User enters a drug and a patient condition/allergy to check against -->
    <form action="/contraindication-result" method="POST" class="search-form">
        <label for="drug">Drug Name</label>
        <input type="text" id="drug" name="drug" placeholder="e.g. Ibuprofen" required>

        <label for="condition">Patient Condition / Allergy</label>
        <input type="text" id="condition" name="condition" placeholder="e.g. Peptic ulcer disease" required>

        <button type="submit">Check Contraindication</button>
    </form>

    <p class="back-link"><a href="/">Back to Home</a></p>

</div>

</body>
</html>
